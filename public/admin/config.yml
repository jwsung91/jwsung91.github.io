backend:
  name: github
  repo: jwsung91/jwsung91.github.io
  branch: main
  auth_type: pkce
  app_id: Ov23liYVXfFl7DLqv6gX

media_folder: "public/images"
public_folder: "/images"

site_url: https://jwsung91.github.io
display_url: https://jwsung91.github.io

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime",
          format: "YYYY-MM-DD", date_format: "YYYY-MM-DD",
          time_format: false }
      - { label: "Category", name: "category", widget: "select",
          options: ["devlog", "study", "adr", "note"] }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Description", name: "description", widget: "string",
          required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "now"
    label: "Now"
    files:
      - label: "Now Page"
        name: "now"
        file: "src/content/now.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden",
              default: "Now" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "GitHub", name: "github", widget: "string" }
      - { label: "Docs", name: "docs", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Status", name: "status", widget: "select",
          options: ["active", "stable", "archived"] }
      - { label: "Featured", name: "featured", widget: "boolean",
          default: false }

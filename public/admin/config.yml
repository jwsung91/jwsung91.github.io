backend:
  name: github
  repo: jwsung91/jwsung91.github.io
  branch: main
  base_url: https://jwsung91-github-io.jwsung91.workers.dev

media_folder: "public/images"
public_folder: "/images"

site_url: https://jwsung91.github.io
display_url: https://jwsung91.github.io

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime",
          format: "YYYY-MM-DD", date_format: "YYYY-MM-DD",
          time_format: false }
      - { label: "Category", name: "category", widget: "select",
          options: ["devlog", "study", "adr", "note"] }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Description", name: "description", widget: "string",
          required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Body"
        name: "body"
        widget: "richtext"
        modes: ["raw"]
        editor_components: ["code-block", "image"]

  - name: "now"
    label: "Now"
    files:
      - label: "Now Page"
        name: "now"
        file: "src/content/now.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden",
              default: "Now" }
          - { label: "Updated At", name: "updatedAt", widget: "string",
              required: false }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Status", name: "status", widget: "select",
          options: ["active", "wip", "archived"] }
      - { label: "Repository URL", name: "repo", widget: "string",
          required: false }
      - { label: "Project URL", name: "url", widget: "string",
          required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Order", name: "order", widget: "number", default: 99 }

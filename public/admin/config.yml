backend:
  name: github
  repo: jwsung91/jwsung91.github.io
  branch: main
  base_url: https://jwsung91-github-io.jwsung91.workers.dev

media_folder: "public/images"
public_folder: "/images"

site_url: https://jwsung91.github.io
display_url: https://jwsung91.github.io

output:
  omit_empty_optional_fields: true
  yaml:
    quote: none
    indent_size: 2
    indent_sequences: true

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} - {{date}}"
    sortable_fields:
      - title
      - date
      - project
      - kind
      - topic
      - series
      - seriesOrder
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: true

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true

      - label: "Updated At"
        name: "updatedAt"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "실질적으로 내용을 수정한 경우에만 입력합니다."

      - label: "Project"
        name: "project"
        widget: "string"
        required: false
        hint: "프로젝트와 직접 관련 없는 개인 공부 글이면 비워둡니다. 소문자/숫자/하이픈(-) 조합으로 입력해주세요. (예: unilink, ai-curator, site)"

      - label: "Kind"
        name: "kind"
        widget: "select"
        required: true
        hint: "글의 성격을 선택합니다."
        options:
          - { label: "Design", value: "design" }
          - { label: "Implementation", value: "implementation" }
          - { label: "Release", value: "release" }
          - { label: "Retrospective", value: "retrospective" }
          - { label: "Study", value: "study" }
          - { label: "Note", value: "note" }
          - { label: "Devlog", value: "devlog" }

      - label: "Topic"
        name: "topic"
        widget: "string"
        required: false
        hint: "프로젝트와 직접 관련 없는 study/note 글의 주제입니다. 소문자/숫자/하이픈(-) 조합으로 입력해주세요. (예: cpp, ros2, system-design, tooling, cms-site)"

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "보조 키워드입니다. 메인 탐색 UI에는 노출하지 않고 관련 글/SEO 용도로 사용합니다."

      - label: "Description"
        name: "description"
        widget: "string"
        required: true
        hint: "검색 결과와 글 목록에 표시됩니다. 40~180자로 작성하세요."
        pattern:
          - "^.{40,180}$"
          - "description은 40~180자로 작성해주세요."

      - label: "Series"
        name: "series"
        widget: "select"
        required: false
        hint: "연속 글이 아니라면 비워둡니다."
        options:
          - { label: "unilink 설계 노트", value: "unilink-design" }
          - {
              label: "AI Curator 파이프라인 구축기",
              value: "ai-curator-pipeline",
            }
          - { label: "C++ STL Study", value: "cpp-stl-study" }

      - label: "Series Order"
        name: "seriesOrder"
        widget: "number"
        value_type: "int"
        min: 1
        step: 1
        required: false
        hint: "같은 시리즈 안에서 읽을 순서입니다."

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        required: false

      - label: "Body"
        name: "body"
        widget: "markdown"
        required: true
        editor_components:
          - "code-block"
          - "image"

  - name: "now"
    label: "Now"
    files:
      - label: "Now Page"
        name: "now"
        file: "src/content/now.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Now" }
          - label: "Updated At"
            name: "updatedAt"
            widget: "datetime"
            format: "YYYY-MM-DD"
            date_format: "YYYY-MM-DD"
            time_format: false
            required: false
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["active", "wip", "archived"],
        }
      - {
          label: "Repository URL",
          name: "repo",
          widget: "string",
          required: false,
        }
      - { label: "Project URL", name: "url", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Order", name: "order", widget: "number", default: 99 }
